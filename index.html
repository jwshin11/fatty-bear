<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatty Bear</title>
    <style>
      /* The canvas and the screen GIFs are stacked layers of the same 800x800
         box. The GIFs animate in the DOM, which canvas 2d can't do on its own. */
      #stage {
        position: relative;
        width: 1400px;
        height: 800px;
      }
      /* Every gif in gifs/menu/. Two are pinned to the sides of the title and
         the rest are scattered at random; main.ts does all the positioning,
         since it is the only place that knows how many gifs there are. Here we
         only say that they float and how big they get. Each is centred on its
         point, hence the translate. */
      #menu-gifs {
        position: absolute;
        inset: 0;
        pointer-events: none; /* clicks must reach the canvas underneath */
      }
      #menu-gifs img {
        position: absolute;
        height: 135px; /* widths follow each gif's own aspect ratio */
        transform: translate(-50%, -50%);
      }
      /* The two gifs pinned to the sides of the title, sized to anchor the
         layout. main.ts decides which those are and hangs this class on them. */
      #menu-gifs img.ring-anchor {
        height: 400px;
      }
      /* Every gif in gifs/restart/. One is pinned to the top and the rest are
         scattered at random; main.ts does all the positioning, since it is the
         only place that knows how many gifs there are. Here we only say that
         they float and how big they get. Each is centred on its point, hence
         the translate. */
      #restart-gifs {
        position: absolute;
        inset: 0;
        display: none; /* the game opens on the menu */
        pointer-events: none; /* clicks must reach the canvas underneath */
      }
      #restart-gifs img {
        position: absolute;
        height: 200px; /* widths follow each gif's own aspect ratio */
        transform: translate(-50%, -50%);
      }
      /* The one gif pinned to the top of the screen, drawn larger than the
         scattered rest. main.ts hangs this class on it. */
      #restart-gifs img.apex {
        height: 290px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="menu-gifs"></div>
      <div id="restart-gifs"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
